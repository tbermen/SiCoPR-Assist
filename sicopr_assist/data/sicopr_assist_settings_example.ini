# SiCoPR-Assist behaviour limits (example with the built-in defaults).
#
# Where the tool looks, later files win:
#   1. built-in defaults (the values shown here)
#   2. user file      %USERPROFILE%\.sicopr\assist.ini     follows you into every project folder
#   3. project file   <project folder>\.sicopr\assist.ini  applies to this project only
#
# Every line is optional. A missing line keeps the default.
# A mistyped name or an unusable value never stops a run: the default stays in force and a warning says so.

[limits]

# A sweep or batch with more NEW runs than this asks for confirmation or an edit before it starts.
# Points whose result is reused from an earlier run are not counted. 0 = always ask.
max_new_runs = 30

# The syntax tutor shows on its own while the project history holds fewer successful commands than this.
# 0 = never on its own ("What can I say?" always works).
tutor_until_commands = 5

# A channel download larger than this many megabytes asks before it starts.
max_download_mb = 500

# Automatic retries of an interrupted download before the tool stops and reports it.
download_retries = 1

# How close (0 to 1) a typed name has to be to a real parameter name to be offered as a choice.
name_match_cutoff = 0.8

# The most options listed in one question.
max_options = 8

# Trouble detection: when this many of the most recent commands (trouble_window) were misses, the tutor comes up
# with the nearest phrase it understands. A miss is a phrase with a word that could not be placed, a phrase that
# matched nothing, or a question that was cancelled. trouble_misses = 0 turns this off.
trouble_misses = 3
trouble_window = 5

# When the tutor comes up because of trouble it can add one line about "Export feedback".
# That line is shown at most once in this many commands.
feedback_notice_gap = 20

# "How does X correlate to Y?" gives a correlation coefficient only when the last set of runs holds at least
# this many results. With fewer it lists the pairs and the difference.
min_correlation_points = 3


[feedback]

# "Export feedback" writes a text file you can read and then email to the developer at
# sicopr_assist.showman405@simplelogin.com. Nothing is ever sent by the tool.
# The first lines of that file say what was masked and what was not.

# on: paths, file names and names that are not standard COM keywords (for example your own package block names)
# are replaced by placeholders such as <file1> and <block1>. off: phrases are exported as typed.
mask_names = on

# on: numbers are replaced by <num>, with their units kept. off: numbers are exported as typed.
# Turn this on if the values you type are confidential, for example a proprietary package model.
mask_numbers = off

# on: the one-line note about "Export feedback" described above is shown. off: it never is.
feedback_notice = on


[translator]

# on: when the strict reading of a phrase misses (a word it cannot place, a name that is not a COM keyword), a layer of
# rules and interface presets proposes a reading in COM terms and hands it to the same core, which validates and plans
# it as typed input; every command records what the layer did. off: strict mode only, literal, and it asks.
translator = on
